# Toutes les 5 minutes : relit les flux SNCF et publie trains.json sur GitHub Pages.
# GitHub peut décaler ou sauter des exécutions planifiées quand ses serveurs sont chargés.
name: Relais trains

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  relais:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: jour
        run: echo "jour=$(TZ=Europe/Paris date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Les horaires théoriques (5 Mo) ne sont téléchargés qu'une fois par jour.
      - uses: actions/cache@v4
        with:
          path: cache
          key: horaires-${{ steps.jour.outputs.jour }}

      - run: python3 relais.py --out site/trains.json --cache cache

      - run: cp index.html site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub coupe les tâches planifiées d'un dépôt sans activité depuis 60 jours :
      # on les réactive à chaque passage.
      - name: Garder la planification active
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/relais.yml/enable" || true
