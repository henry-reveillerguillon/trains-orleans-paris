# Publie horaires.json (trains théoriques Orléans → Paris et leurs dates) sur GitHub Pages.
# Le temps réel est ajouté par la fonction Serverless du plugin TRMNL (trmnl/serverless.py),
# à chaque rechargement : cette tâche n'a besoin de tourner qu'à chaque envoi de code,
# et une fois par semaine pour suivre les nouvelles versions des horaires SNCF.
name: Horaires trains

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  horaires:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 horaires.py site/horaires.json
      - run: cp index.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
